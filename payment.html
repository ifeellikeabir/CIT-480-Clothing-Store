    <h1>Wardrobe.io</h1>
    <h2>Checkout</h2>

    <form id="checkout-form">

        <h3>Billing Information</h3>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required>

        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>

        <br><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>

        <br><br>

        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" name="zip" required>


        <h3>Payment Information</h3>

        <label for="card-name">Name on Card:</label>
        <input type="text" id="card-name" name="card-name" required>

        <br><br>

        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" name="card-number" required>

        <br><br>

        <label for="expiration">Expiration Date:</label>
        <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required>

        <br><br>

        <label for="cvv">CVV:</label>
        <input type="password" id="cvv" name="cvv" required>

        <br><br>

        <button type="submit" id="submit-order-btn">Place Order</button>

    </form>

    <script>
        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Get cart items from localStorage
            const cart = JSON.parse(localStorage.getItem('wardrobe_cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty! Add some items before checking out.");
                window.location.href = "index.html#shop";
                return;
            }

            // 2. Calculate total amount
            const subtotal = cart.reduce((total, item) => total + (item.price * (item.quantity || 1)), 0);
            const shipping = subtotal >= 50 ? 0 : 5.99;
            const totalAmount = subtotal + shipping;

            // 3. Construct payload matching your server.js route expectations
            const orderData = {
                total_amount: totalAmount,
                shipping_name: document.getElementById('name').value,
                shipping_email: document.getElementById('email').value,
                shipping_address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip_code: document.getElementById('zip').value,
                items: cart
            };

            try {
                // 4. Send POST request to backend server
                const response = await fetch('http://localhost:3000/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to place order');
                }

                // 5. Success! Clear cart storage and notify user
                alert(`Order placed successfully! Order ID: ${result.orderId}`);
                localStorage.removeItem('wardrobe_cart');
                window.location.href = "index.html";

            } catch (error) {
                console.error('Checkout error:', error);
                alert('There was a problem processing your order. Please make sure your server is running.');
            }
        });
    </script>

</body>

</html>
